<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cr brm</title>
<style>
  :root { --bg: #14151a; --text: #f2f2f5; --muted: #9a9cab; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    padding: 1.5rem;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  p { margin: 0; color: var(--muted); text-align: center; }
  .pads {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 13rem));
    gap: 1.5rem;
    width: 100%;
    justify-content: center;
  }
  @media (max-width: 480px) { .pads { grid-template-columns: minmax(0, 16rem); } }
  .pad {
    aspect-ratio: 1;
    border: 0;
    border-radius: 1.5rem;
    background: var(--c);
    color: #14151a;
    font: inherit;
    font-size: clamp(2.5rem, 10vw, 3.5rem);
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 .5rem 0 var(--shadow);
    transition: transform .08s, box-shadow .08s, filter .08s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  @media (max-width: 480px) { .pad { aspect-ratio: 1.6; } }
  .pad:hover { filter: brightness(1.08); }
  .pad:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  .pad:active, .pad.playing {
    transform: translateY(.35rem);
    box-shadow: 0 .15rem 0 var(--shadow);
    filter: brightness(1.2);
  }
  @media (prefers-reduced-motion: reduce) { .pad { transition: none; } }
</style>
</head>
<body>
  <main class="pads">
    <button class="pad" data-src="cr.m4a" style="--c:#ffd166;--shadow:#b8902f">cr</button>
    <button class="pad" data-src="brm.m4a" style="--c:#ef6f6c;--shadow:#a8413f">brm</button>
  </main>
  <p>Tasti 1 e 2 sulla tastiera</p>

<script>
  const pads = [...document.querySelectorAll('.pad')];
  pads.forEach(pad => {
    pad.audio = new Audio(pad.dataset.src);
    pad.audio.preload = 'auto';
    pad.audio.addEventListener('ended', () => pad.classList.remove('playing'));
    pad.addEventListener('click', () => play(pad));
  });

  function play(pad) {
    const a = pad.audio;
    a.currentTime = 0; // riparte da capo se premuto di nuovo
    a.play();
    pad.classList.add('playing');
  }

  document.addEventListener('keydown', e => {
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    const pad = pads[Number(e.key) - 1];
    if (pad) play(pad);
  });
</script>
</body>
</html>
